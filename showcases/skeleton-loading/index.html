<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Skeleton Loading — UX Showcase</title>
  <meta name="description" content="Spinner vs. skeleton loading: feel the difference in perceived performance." />
  <style>
    :root {
      --bg: #f4f7fa;
      --card: #ffffff;
      --ink: #1b2330;
      --muted: #6b7689;
      --line: #e6ebf1;
      --brand: #3b82f6;
      --skel-a: #e9edf2;
      --skel-b: #f4f7fa;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      padding: max(16px, env(safe-area-inset-top)) 16px 48px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    header { padding: 24px 4px 8px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -.01em; }
    p.sub { color: var(--muted); margin: 0 0 20px; }
    .controls {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      position: sticky; top: 0; z-index: 5;
      background: var(--bg); padding: 12px 0 16px;
    }
    button {
      font: inherit; font-weight: 600;
      border: 1px solid var(--line); background: var(--card); color: var(--ink);
      padding: 10px 16px; border-radius: 999px; cursor: pointer;
      transition: transform .08s ease, background .15s ease, border-color .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(.96); }
    button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
    .seg button { border: 0; border-radius: 0; padding: 10px 14px; }
    .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }

    .list { display: grid; gap: 12px; margin-top: 8px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 16px; display: flex; gap: 14px; align-items: center;
    }
    .avatar { width: 52px; height: 52px; border-radius: 50%; flex: 0 0 auto; object-fit: cover; background: var(--skel-a); }
    .meta { flex: 1; min-width: 0; }
    .name { font-weight: 700; margin: 0 0 4px; }
    .role { color: var(--muted); margin: 0; font-size: .9375rem; }
    .pill { font-size: .8125rem; color: var(--brand); font-weight: 600; }

    /* --- Skeleton --- */
    .skeleton-block {
      background: linear-gradient(90deg, var(--skel-a) 25%, var(--skel-b) 37%, var(--skel-a) 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
      border-radius: 8px;
    }
    .s-avatar { width: 52px; height: 52px; border-radius: 50%; flex: 0 0 auto; }
    .s-line { height: 12px; border-radius: 6px; }
    .s-line.lg { height: 16px; width: 55%; margin-bottom: 8px; }
    .s-line.sm { width: 35%; }
    @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

    /* --- Spinner --- */
    .center { display: grid; place-items: center; padding: 48px 0; }
    .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--brand); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .enter { animation: fadein .35s ease both; }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .note { color: var(--muted); font-size: .875rem; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }

    @media (prefers-reduced-motion: reduce) {
      .skeleton-block { animation: none; }
      .spinner { animation-duration: 1.6s; }
      .enter { animation: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Skeleton vs. Spinner</h1>
      <p class="sub">Same 1.6s load. Switch the loader and reload to feel the perceived-speed difference.</p>
    </header>

    <div class="controls">
      <div class="seg" role="group" aria-label="Loader type">
        <button id="useSkeleton" aria-pressed="true">Skeleton</button>
        <button id="useSpinner" aria-pressed="false">Spinner</button>
      </div>
      <button class="primary" id="reload">Reload ↻</button>
    </div>

    <main id="stage" class="list" aria-live="polite" aria-busy="true"></main>

    <p class="note">
      Watch how the skeleton previews the final layout so there's no jump when content arrives.
      The spinner tells you nothing about what's coming. This demo honors
      <code>prefers-reduced-motion</code>.
    </p>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const LOAD_MS = 1600;
    let mode = 'skeleton';
    let timer = null;

    const PEOPLE = [
      { name: 'Mina Park',   role: 'Product Designer', tag: 'Online' },
      { name: 'Leo Navarro', role: 'iOS Engineer',     tag: '2m ago' },
      { name: 'Ava Chen',    role: 'UX Researcher',    tag: 'Online' },
      { name: 'Omar Haddad', role: 'Frontend Lead',    tag: '1h ago' },
    ];

    function skeletonCard() {
      return `
        <div class="card">
          <div class="skeleton-block s-avatar"></div>
          <div class="meta">
            <div class="skeleton-block s-line lg"></div>
            <div class="skeleton-block s-line sm"></div>
          </div>
        </div>`;
    }

    function realCard(p, i) {
      const initials = p.name.split(' ').map(s => s[0]).join('');
      const avatar = `https://placehold.co/104x104/dbe6f5/3b82f6?text=${encodeURIComponent(initials)}`;
      return `
        <div class="card enter" style="animation-delay:${i * 60}ms">
          <img class="avatar" src="${avatar}" alt="" width="52" height="52" loading="lazy" />
          <div class="meta">
            <p class="name">${p.name}</p>
            <p class="role">${p.role}</p>
          </div>
          <span class="pill">${p.tag}</span>
        </div>`;
    }

    function showLoading() {
      stage.setAttribute('aria-busy', 'true');
      if (mode === 'skeleton') {
        stage.innerHTML = PEOPLE.map(skeletonCard).join('');
      } else {
        stage.innerHTML = `<div class="center"><div class="spinner" role="status" aria-label="Loading"></div></div>`;
      }
    }

    function showContent() {
      stage.setAttribute('aria-busy', 'false');
      stage.innerHTML = PEOPLE.map(realCard).join('');
    }

    function run() {
      clearTimeout(timer);
      showLoading();
      timer = setTimeout(showContent, LOAD_MS);
    }

    function setMode(next) {
      mode = next;
      document.getElementById('useSkeleton').setAttribute('aria-pressed', String(next === 'skeleton'));
      document.getElementById('useSpinner').setAttribute('aria-pressed', String(next === 'spinner'));
      run();
    }

    document.getElementById('useSkeleton').addEventListener('click', () => setMode('skeleton'));
    document.getElementById('useSpinner').addEventListener('click', () => setMode('spinner'));
    document.getElementById('reload').addEventListener('click', run);

    run();
  </script>
</body>
</html>
